apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseloop
  namespace: rlt-mrf
  labels:
    app.kubernetes.io/name: pulseloop
    app.kubernetes.io/part-of: rlt-mrf
spec:
  # Selective redundancy: three replicas spread across nodes/zones. Each
  # PulseLoop instance is self-contained, so no leader election is needed at
  # this layer; the Service load-balances and failover is instant.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pulseloop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulseloop
        app.kubernetes.io/part-of: rlt-mrf
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pulseloop
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pulseloop
      # Give the graceful drain (readiness flip + loop shutdown, ~25s budget
      # in main.go) room to finish before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulseloop
          image: ghcr.io/fotoblinkskudd2-create/pulseloop:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PULSE_MAX_DEPTH
              value: "8"
            - name: PULSE_QUEUE_SIZE
              value: "1024"
            - name: PULSE_DEFAULT_TIMEOUT
              value: "30s"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulseloop
  namespace: rlt-mrf
  labels:
    app.kubernetes.io/name: pulseloop
spec:
  selector:
    app.kubernetes.io/name: pulseloop
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulseloop
  namespace: rlt-mrf
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulseloop
