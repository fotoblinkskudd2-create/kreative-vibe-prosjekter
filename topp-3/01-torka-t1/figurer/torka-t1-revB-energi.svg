<text x="68" y="976" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">Sensibel post faller fra 0,34 til 0,17 kWh — 0,17 kWh spart per syklus, og syklusen kommer under effekttaket.</text>
