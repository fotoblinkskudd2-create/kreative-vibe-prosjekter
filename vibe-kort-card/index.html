<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe-kort</title>
<style>
  :root {
    --gold: #F5B400;
    --gold-press: #DC9F00;
    --ink: #1A1A1A;
    --grey: #6B6B6B;
    --line: #ECECEC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F7F5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .card {
    width: 340px;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  }

  .tag {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 20px;
    line-height: 24px;
    margin: 0 0 8px;
    color: var(--ink);
  }

  p.desc {
    font-size: 14px;
    line-height: 20px;
    color: var(--grey);
    margin: 0 0 24px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .primary {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--gold);
    color: var(--ink);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary:active { background: var(--gold-press); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
  }

  .secondary {
    background: none;
    border: none;
    color: var(--grey);
    font-size: 14px;
    padding: 8px 0;
    cursor: pointer;
  }

  .expand {
    background: none;
    border: none;
    color: var(--grey);
    font-size: 14px;
    padding: 8px 0;
    cursor: pointer;
  }

  .meta {
    margin-top: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--grey);
    display: none;
  }
  .meta.open { display: block; }
  .meta div + div { margin-top: 4px; }
</style>
</head>
<body>

<div class="card">
  <span class="tag">Musikkidé</span>
  <h1>Satirisk julesang om strømpriser</h1>
  <p class="desc">Kort, vrient verselinje + refreng. Klar for innspilling i helgen.</p>

  <button class="primary">Bygg nå</button>

  <div class="row">
    <button class="secondary">Del idé</button>
    <button class="expand" id="expandBtn">Detaljer ▾</button>
  </div>

  <div class="meta" id="meta">
    <div>Opprettet: 12. juni 2026</div>
    <div>Status: Utkast</div>
  </div>
</div>

<script>
  const btn = document.getElementById('expandBtn');
  const meta = document.getElementById('meta');
  btn.addEventListener('click', () => {
    const open = meta.classList.toggle('open');
    btn.textContent = open ? 'Detaljer ▴' : 'Detaljer ▾';
  });
</script>

</body>
</html>
